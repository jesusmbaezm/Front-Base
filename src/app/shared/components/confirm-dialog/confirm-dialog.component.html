<div class="confirm-modal">

  <div class="modal-body">
    <div class="modal-header">
      <div class="modal-icon" [ngClass]="'icon-' + variant">

        <!-- contract_approve: document + checkmark -->
        <svg *ngIf="data.icon === 'contract_approve'" width="20" height="20" viewBox="0 -960 960 960" fill="currentColor">
          <path d="M720-120 580-260l56-56 84 84 168-168 56 56-224 224ZM240-80q-50 0-85-35t-35-85v-120h120v-560h600v415q-19-7-39-10.5t-41-3.5v-321H320v480h214q-7 19-10.5 39t-3.5 41H200v40q0 17 11.5 28.5T240-160h294q8 23 20 43t28 37H240Zm120-520v-80h360v80H360Zm0 120v-80h360v80H360Zm174 320H200h334Z"/>
        </svg>
        <!-- handshake_cancel -->
        <svg *ngIf="data.icon === 'handshake_cancel'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m11 17 2 2a1 1 0 1 0 3-3"/>
          <path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/>
          <path d="m21 3 1 11h-2"/>
          <path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/>
          <path d="M3 4h8"/>
        </svg>
        <!-- material symbols fallback -->
        <span *ngIf="data.icon && data.icon !== 'contract_approve' && data.icon !== 'handshake_cancel'" class="material-symbols-outlined" style="font-size:20px;width:20px;height:20px;line-height:20px;">{{ data.icon }}</span>

        <!-- danger: trash -->
        <svg *ngIf="!data.icon && variant === 'danger'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
        </svg>

        <!-- success: check-circle -->
        <svg *ngIf="!data.icon && variant === 'success'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>

        <!-- warning: triangle -->
        <svg *ngIf="!data.icon && variant === 'warning'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
        </svg>

        <!-- primary: lock -->
        <svg *ngIf="!data.icon && variant === 'primary'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75M3.75 21.75h16.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H3.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
        </svg>

      </div>

      <div class="modal-text">
        <div class="modal-title">{{ data.title }}</div>
        <div class="modal-desc" [innerHTML]="data.message"></div>
      </div>
    </div>

    <div class="modal-input-group" *ngIf="data.showInput">
      <label class="modal-input-label" *ngIf="data.inputLabel">{{ data.inputLabel }}</label>
      <textarea class="modal-textarea"
                [(ngModel)]="inputValue"
                [placeholder]="data.inputPlaceholder || ''"
                rows="3"></textarea>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn btn-cancel" (click)="onCancel()">
      {{ cancelText }}
    </button>
    <button class="btn" [ngClass]="'btn-' + variant" (click)="onConfirm()" [disabled]="!canConfirm">

      <!-- contract_approve: document + checkmark -->
      <svg *ngIf="data.icon === 'contract_approve'" width="13" height="13" viewBox="0 -960 960 960" fill="currentColor">
        <path d="M720-120 580-260l56-56 84 84 168-168 56 56-224 224ZM240-80q-50 0-85-35t-35-85v-120h120v-560h600v415q-19-7-39-10.5t-41-3.5v-321H320v480h214q-7 19-10.5 39t-3.5 41H200v40q0 17 11.5 28.5T240-160h294q8 23 20 43t28 37H240Zm120-520v-80h360v80H360Zm0 120v-80h360v80H360Zm174 320H200h334Z"/>
      </svg>
      <!-- handshake_cancel -->
      <svg *ngIf="data.icon === 'handshake_cancel'" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg>
      <!-- material symbols fallback -->
      <span *ngIf="data.icon && data.icon !== 'contract_approve' && data.icon !== 'handshake_cancel'" class="material-symbols-outlined" style="font-size:14px;width:14px;height:14px;line-height:14px;">{{ data.icon }}</span>

      <!-- danger icon -->
      <svg *ngIf="!data.icon && variant === 'danger'" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
      </svg>

      <!-- success icon -->
      <svg *ngIf="!data.icon && variant === 'success'" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>

      <!-- warning icon -->
      <svg *ngIf="!data.icon && variant === 'warning'" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>

      <!-- primary icon -->
      <svg *ngIf="!data.icon && variant === 'primary'" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75M3.75 21.75h16.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H3.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
      </svg>

      {{ confirmText }}
    </button>
  </div>

</div>
