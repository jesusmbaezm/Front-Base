<div class="toast" [ngClass]="'toast-' + data.variant"
     (mouseenter)="data.onMouseEnter?.()"
     (mouseleave)="data.onMouseLeave?.()">

  <!-- Icon -->
  <svg class="toast-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
    <!-- success: circle + checkmark -->
    <ng-container *ngIf="data.variant === 'success'">
      <circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5"/>
      <path d="M5.5 9l2.5 2.5 4.5-4.5" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round"/>
    </ng-container>
    <!-- error: circle + X -->
    <ng-container *ngIf="data.variant === 'error'">
      <circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5"/>
      <path d="M6.5 6.5l5 5M11.5 6.5l-5 5" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round"/>
    </ng-container>
    <!-- warning: triangle + ! -->
    <ng-container *ngIf="data.variant === 'warning'">
      <path d="M9 2L16.5 15H1.5L9 2z" stroke="currentColor" stroke-width="1.5"
            stroke-linejoin="round"/>
      <line x1="9" y1="7.5" x2="9" y2="10.5" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round"/>
      <circle cx="9" cy="12.5" r="0.75" fill="currentColor"/>
    </ng-container>
    <!-- loading: spinning arc -->
    <ng-container *ngIf="data.variant === 'loading'">
      <circle class="toast-spinner-track" cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.75" fill="none" opacity="0.25"/>
      <circle class="toast-spinner-arc" cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.75" fill="none"
              stroke-dasharray="22 22" stroke-linecap="round"/>
    </ng-container>
    <!-- info / neutral: circle + i -->
    <ng-container *ngIf="data.variant === 'info' || data.variant === 'neutral'">
      <circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5"/>
      <line x1="9" y1="8.5" x2="9" y2="12" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round"/>
      <circle cx="9" cy="6.25" r="0.875" fill="currentColor"/>
    </ng-container>
  </svg>

  <div class="toast-body">
    <p class="toast-title">{{ data.title }}</p>
    <p class="toast-desc" *ngIf="data.message">{{ data.message }}</p>
  </div>

  <button class="toast-close" (click)="close()">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round"/>
    </svg>
  </button>

</div>
