<section class="parametros-page">
  <header class="page-header">
    <div>
      <h1>Parámetros</h1>
      <p>Gestión de parámetros del sistema</p>
    </div>
  </header>

  <mat-card class="filters-card demo-card">
    <mat-card-content>
      <div class="filters-toolbar">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
          <mat-label>Buscar</mat-label>
          <input matInput [value]="searchControl()"
                 (input)="onSearchInput($any($event.target).value)"
                 placeholder="Nombre o valor" />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <div class="filters-actions">
          <app-button variant="ghost" matIcon="filter_alt_off" [iconOnly]="true" (onClick)="clearFilters()" matTooltip="Limpiar filtros"></app-button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <div class="tbl-card">
    @if (isLoading()) {
      <div class="loading-overlay">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    }
    <div class="table-container">
      <table mat-table [dataSource]="parameters()">

        <ng-container matColumnDef="parameter">
          <th mat-header-cell *matHeaderCellDef>Parámetro</th>
          <td mat-cell *matCellDef="let p">
            <strong>{{ p.name }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef>Valor</th>
          <td mat-cell *matCellDef="let p">{{ p.value }}</td>
        </ng-container>

        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="actions-header"></th>
          <td mat-cell *matCellDef="let p" (click)="$event.stopPropagation()">
            <div class="row-actions">
              <button *appHasPermission="Permissions.parameters.update" class="auth-btn edit" (click)="openEditDialog(p)" matTooltip="Editar">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2-7 7H2.5v-2l7-7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="empty-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">
            <div class="empty-state">
              <mat-icon>tune</mat-icon>
              <p>No se encontraron parámetros</p>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </div>
</section>
