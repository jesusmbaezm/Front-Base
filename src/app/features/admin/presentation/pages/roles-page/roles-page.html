<section class="roles-page">
  <header class="page-header">
    <div>
      <h1>Roles</h1>
      <p>Gestión de roles y permisos del sistema</p>
    </div>

    <div class="page-header__actions">
      <app-button *appHasPermission="Permissions.roles.create" variant="primary" matIcon="add_box"
        (onClick)="openCreateDialog()" [disabled]="isSubmitting()">
        Nuevo rol
      </app-button>
    </div>
  </header>

  <div class="tbl-card">
    @if (isLoading()) {
      <div class="loading-overlay">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    }
    <div class="table-container">
      <table mat-table [dataSource]="roles()">

        <!-- Columna Rol -->
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let role">
            <div class="role-cell">
              <span class="role-name">{{ role.name }}</span>
              @if (role.isSystem) {
                <span class="badge-system">Sistema</span>
              }
            </div>
          </td>
        </ng-container>

        <!-- Columna Descripción -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let role">
            <span class="role-desc">{{ role.description }}</span>
          </td>
        </ng-container>

        <!-- Columna Permisos -->
        <ng-container matColumnDef="permissions">
          <th mat-header-cell *matHeaderCellDef>Permisos</th>
          <td mat-cell *matCellDef="let role">
            <span class="perm-count">
              <span class="perm-count-num">{{ role.permissions.length }}</span>
              permisos
            </span>
          </td>
        </ng-container>

        <!-- Columna Acciones -->
        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="actions-header"></th>
          <td mat-cell *matCellDef="let role" (click)="$event.stopPropagation()">
            <div class="row-actions">
              <button *appHasPermission="Permissions.roles.update" class="auth-btn edit" (click)="openEditDialog(role)" matTooltip="Editar">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2-7 7H2.5v-2l7-7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
              </button>
              @if (!role.isSystem) {
                <button *appHasPermission="Permissions.roles.delete" class="auth-btn delete" (click)="deleteRole(role)" matTooltip="Eliminar">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                </button>
              }
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="empty-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">
            <div class="empty-state">
              <mat-icon>admin_panel_settings</mat-icon>
              <p>No se encontraron roles</p>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </div>
</section>
