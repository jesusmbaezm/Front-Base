<div class="modal-wrapper">
  <!-- Header -->
  <div class="modal-header">
    <div>
      <div class="modal-title">{{ isEdit ? 'Editar' : 'Nuevo' }} Backorder</div>
    </div>
    <button class="modal-close" type="button" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="modal-body">
    <form [formGroup]="form">
      <div class="form-field">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="full-width">
          <mat-label>Sucursal</mat-label>
          <mat-select formControlName="branchId">
            @for (branch of branches(); track branch.id) {
              <mat-option [value]="branch.id">{{ branch.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="form-field">
        <app-product-lookup
          label="Buscar producto"
          [branchId]="form.get('branchId')?.value ?? null"
          noSelectionText="Selecciona una sucursal primero"
          (productSelected)="onProductSelected($event)"
          #productLookupComponent
        ></app-product-lookup>
      </div>

      <div class="form-field no-margin">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="full-width">
          <mat-label>Cantidad</mat-label>
          <input
            matInput
            type="number"
            formControlName="Quantity"
            min="1"
            step="1"
            (keydown)="onQuantityKeydown($event)"
          />
          @if (form.get('Quantity')?.invalid && form.get('Quantity')?.touched) {
            <mat-error>Ingrese una cantidad mayor a 0</mat-error>
          }
        </mat-form-field>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <app-modal-footer
    [saveLabel]="isEdit ? 'Guardar' : 'Crear'"
    [saveDisabled]="form.invalid"
    [isSubmitting]="isSubmitting()"
    (cancel)="onCancel()"
    (save)="onSubmit()"
  >
  </app-modal-footer>
</div>
